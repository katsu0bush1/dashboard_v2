 if(m==='win'){return heat(((u.wr||0)-0.5)/0.22,sh);}                              // 基準 勝率50%
}
const LEG={setting:'推定設定 P(≥5)｜青=低 ←灰→ 赤=高',ratio:'出率｜青<100% ←灰→ 赤>100%',
 diff:'差枚/日｜青− ←灰→ 赤+',win:'勝率｜青=低 ←灰→ 赤=高'};
const FC={smoke:'#2e7d4f',ent:'#8b1a1a',esc:'#37474f',wall:'#37485c',counter:'#b8860b',wc:'#c2185b'};
const FLB={smoke:'喫煙所',ent:'出入口',esc:'ESC',wall:'',counter:'カウンター',wc:'🚻'};
let MODE='setting', PERIOD=(PMETA.find(p=>p.key==='all')||PMETA[0]).key, GMIN=0;
const svg=document.getElementById('svg'), tip=document.getElementById('tip');
function drawCell(cx,cy,un,mac){
 const u=un!=null?(UD[PERIOD]||{})[un]:null;
 const dim=u&&u.g<GMIN;                 // G数絞りで下回る台は淡色
 let col=u&&!dim?colorFor(MODE,u):null;
 const fill=dim?'#141c26':(col||'#2a3745');
 const r=el('rect',{x:cx,y:cy,width:CS-2,height:CS-2,rx:2,fill:fill,stroke:'#0a1017','stroke-width':0.5,opacity:dim?0.5:1});
 if(un!=null){
  r.addEventListener('mouseenter',()=>{tip.innerHTML=`<b>No.${un}</b> ${(mac||'').slice(0,20)}`+(u?
    `<br>期間 ${PMETA.find(p=>p.key===PERIOD).label}（${u.days}日）<br>平均 差枚/日 ${u.d>=0?'+':''}${u.d} ／ G/日 ${u.g}<br>累計 差枚 ${u.dt>=0?'+':''}${u.dt} ／ 出率 ${u.pr??'-'}% ／ 勝率 ${Math.round((u.wr||0)*100)}%`+(u.est?`<br>推定E[s] <b>${u.est.Es}</b> ／ P(≥5) <b>${Math.round(u.est.phigh*100)}%</b>`:(u.nos?`<br><span style="color:#ff8a80">🚫 ${u.nos}</span>`:'')):'<br><span style="color:#7f92a6">この期間データ無</span>');tip.style.display='block';});
  r.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';});
  r.addEventListener('mouseleave',()=>tip.style.display='none');
 }
 svg.appendChild(r);
 if(un!=null){const fs=8;const tx=el('text',{x:cx+(CS-2)/2,y:cy+(CS-2)/2+fs*0.35,'text-anchor':'middle','font-size':fs,fill:(col&&!dim)?'#0d1420':'#5f7386','pointer-events':'none'});tx.textContent=un;svg.appendChild(tx);}
}
function render(){
 svg.innerHTML='';svg.setAttribute('width',DATA.w);svg.setAttribute('height',DATA.h);
 svg.appendChild(el('rect',{x:10,y:10,width:DATA.w-20,height:DATA.h-20,fill:'#0a1017',stroke:'#233247','stroke-width':2,rx:10}));
 DATA.fixtures.forEach(f=>{svg.appendChild(el('rect',{x:f.x,y:f.y,width:f.w,height:f.h,rx:4,fill:FC[f.t]||'#37485c',stroke:'#556','stroke-width':1,opacity:0.9}));
  const lb=FLB[f.t]||'';if(lb){const t=el('text',{x:f.x+f.w/2,y:f.y+f.h/2+4,fill:'#fff','font-size':10,'text-anchor':'middle','font-weight':'bold'});t.textContent=lb;svg.appendChild(t);}});
 DATA.islands.forEach(is=>{
  const vert=is.o==='v', ring=is.o==='c';
  // 円卓（地図の丸い島）: 台を円周に並べる。半径は「周の長さ = 台数×CS」から逆算する。
  const R=ring?Math.max(is.cells.length,3)*CS/6.2832:0;
  is.cells.forEach((un,i)=>{
   let cx,cy;
   if(ring){const a=i/is.cells.length*6.2832-1.5708;
            cx=is.x+R+R*Math.cos(a);cy=is.y+R+R*Math.sin(a);}
   else{cx=is.x+(vert?0:i*CS);cy=is.y+(vert?i*CS:0);}
   drawCell(cx,cy,un,is.machine);});
  // 名前は島サイズで長さ制限（隣島への溢れ防止）＋半透明背景（重なっても可読・全名はホバーのツールチップ）
  const maxc=Math.max(3,Math.min(14,Math.floor(is.cells.length*CS/5.2)));
  const lbl=(is.machine||'').slice(0,maxc);
  if(lbl){const tl=lbl.length*5.2;
   const lx=ring?is.x+R-tl/2:(vert?is.x+CS+1:is.x), ly=ring?is.y+R+CS/2:(vert?is.y+2:is.y-2);
   const bg=el('rect',{x:lx-1,y:ly-8,width:tl+2,height:11,rx:2,fill:'#0a1017',opacity:0.72,'pointer-events':'none'});
   const t=el('text',{x:lx,y:ly,fill:'#dbe6f2','font-size':9,'font-weight':'bold','text-anchor':'start','pointer-events':'none'});
   t.textContent=lbl;
   if(vert&&!ring){bg.setAttribute('transform',`rotate(90 ${lx} ${ly})`);t.setAttribute('transform',`rotate(90 ${lx} ${ly})`);}
   svg.appendChild(bg);svg.appendChild(t);}
 });
 // 凡例＋G数絞りの通過台数
 let vis=0,tot=0;const pd=UD[PERIOD]||{};
 DATA.islands.forEach(is=>is.cells.forEach(un=>{if(un!=null){tot++;const u=pd[un];if(u&&u.g>=GMIN)vis++;}}));
 document.getElementById('legend').textContent=LEG[MODE]+' ／ 大半 '+MAXD+'時点';
 document.getElementById('gcnt').textContent=`（表示 ${vis}/${tot}台）`;
}
// 色モード
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');MODE=b.dataset.m;render();});
// 期間ボタン生成
const pc=document.getElementById('periods');
PMETA.forEach((p,i)=>{const b=document.createElement('span');b.className='btn'+(p.key===PERIOD?' on':'');b.textContent=p.label;b.dataset.p=p.key;
 b.onclick=()=>{document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'));b.classList.add('on');PERIOD=p.key;render();};pc.appendChild(b);});
// G数スライダー
const gmin=document.getElementById('gmin');
gmin.oninput=()=>{GMIN=+gmin.value;document.getElementById('glab').textContent='平均G/日 ≥ '+GMIN;render();};
render();
</script>
