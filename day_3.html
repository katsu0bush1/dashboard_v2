<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>123+N大阪本店 日別ドリルダウン</title><style>
:root{--bg:#0f1923;--card:#1a2735;--border:#2a3f52;--text:#e0e6ed;--sub:#8899aa;
--accent:#4fc3f7;--green:#66bb6a;--red:#ef5350;--yellow:#ffd54f;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);
font-size:14px;padding:12px;}
.container{max-width:820px;margin:0 auto;}
a{color:var(--accent);}
h1{font-size:18px;text-align:center;padding:6px 0;}
.sub{color:var(--sub);font-size:11px;text-align:center;margin-bottom:10px;}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;margin:10px 0;
flex-wrap:wrap;}
.nav button{background:var(--card);color:var(--text);border:1px solid var(--border);
border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;}
.nav button:disabled{opacity:.35;cursor:default;}
#dsel,#ysel{background:var(--card);color:var(--text);border:1px solid var(--border);
border-radius:8px;padding:7px;font-size:13px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
padding:12px;margin-bottom:12px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;}
.kpi{text-align:center;padding:6px;}
.kpi .v{font-size:17px;font-weight:700;}
.kpi .l{font-size:10px;color:var(--sub);}
.plus{color:var(--green);} .minus{color:var(--red);}
table{width:100%;border-collapse:collapse;font-size:11px;}
th{text-align:left;padding:5px 4px;color:var(--sub);font-weight:500;font-size:10px;
border-bottom:1px solid var(--border);}
td{padding:5px 4px;border-bottom:1px solid var(--border);}
tr:hover{background:rgba(79,195,247,.06);}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;}
.note{font-size:10px;color:var(--sub);margin-top:6px;}
</style></head><body><div class="container">
<p class="sub">日別ページへ移動しています…</p>

<script>
const YMAP={"2019":"day_3_2019.html","2020":"day_3_2020.html","2021":"day_3_2021.html","2022":"day_3_2022.html","2023":"day_3_2023.html","2024":"day_3_2024.html","2025":"day_3_2025.html","2026":"day_3_2026.html"};
const LATEST="day_3_2026.html";
const q=new URLSearchParams(location.search).get('d');
const y=(q&&/^[0-9]{8}$/.test(q))?q.slice(0,4):null;
location.replace((y&&YMAP[y]) ? YMAP[y]+'?d='+q : (LATEST+(q?'?d='+q:'')));
</script>
</div></body></html>
