  // 円卓（地図の丸い島）: 台を円周に並べる。半径は「周の長さ = 台数×CS」から逆算する。
  const R=ring?Math.max(is.cells.length,3)*CS/6.2832:0;
  is.cells.forEach((un,i)=>{
   let cx,cy;
   if(ring){const a=i/is.cells.length*6.2832-1.5708;
            cx=is.x+R+R*Math.cos(a);cy=is.y+R+R*Math.sin(a);}
   else{cx=is.x+(vert?0:i*CS);cy=is.y+(vert?i*CS:0);}
   drawCell(cx,cy,un,is.machine);});
  // 名前は島サイズで長さ制限（隣島への溢れ防止）＋半透明背景（重なっても可読・全名はホバーのツールチップ）
  const maxc=Math.max(3,Math.min(14,Math.floor(is.cells.length*CS/5.2)));
  const lbl=(is.machine||'').slice(0,maxc);
  if(lbl){const tl=lbl.length*5.2;
   const lx=ring?is.x+R-tl/2:(vert?is.x+CS+1:is.x), ly=ring?is.y+R+CS/2:(vert?is.y+2:is.y-2);
   const bg=el('rect',{x:lx-1,y:ly-8,width:tl+2,height:11,rx:2,fill:'#0a1017',opacity:0.72,'pointer-events':'none'});
   const t=el('text',{x:lx,y:ly,fill:'#dbe6f2','font-size':9,'font-weight':'bold','text-anchor':'start','pointer-events':'none'});
   t.textContent=lbl;
   if(vert&&!ring){bg.setAttribute('transform',`rotate(90 ${lx} ${ly})`);t.setAttribute('transform',`rotate(90 ${lx} ${ly})`);}
   svg.appendChild(bg);svg.appendChild(t);}
 });
 // 凡例＋G数絞りの通過台数
 let vis=0,tot=0;const pd=UD[PERIOD]||{};
 DATA.islands.forEach(is=>is.cells.forEach(un=>{if(un!=null){tot++;const u=pd[un];if(u&&u.g>=GMIN)vis++;}}));
 document.getElementById('legend').textContent=LEG[MODE]+' ／ 大半 '+MAXD+'時点';
 document.getElementById('gcnt').textContent=`（表示 ${vis}/${tot}台）`;
}
// 色モード
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');MODE=b.dataset.m;render();});
// 期間ボタン生成
const pc=document.getElementById('periods');
PMETA.forEach((p,i)=>{const b=document.createElement('span');b.className='btn'+(p.key===PERIOD?' on':'');b.textContent=p.label;b.dataset.p=p.key;
 b.onclick=()=>{document.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('on'));b.classList.add('on');PERIOD=p.key;render();};pc.appendChild(b);});
// G数スライダー
const gmin=document.getElementById('gmin');
gmin.oninput=()=>{GMIN=+gmin.value;document.getElementById('glab').textContent='平均G/日 ≥ '+GMIN;render();};
render();
</script>
