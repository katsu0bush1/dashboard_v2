  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* ⚠️ `x ? … : '-'` は **0 を欠測として消す**。実測で avg_games_per_unit=0 が 4,986件、
   win_rate NULL が 9件ある。「実値0」と「欠測」を混ぜない（build 側のコメントと同じ規律）。 */
const num=v=>v==null?'-':Number(v).toLocaleString();
let SORT={k:'p',dir:-1};
function val(row,k){ return k==='nm' ? NM[row[0]] : row[IX[k]]; }
function cmpVal(a,b,k,dir){
  const x=val(a,k), y=val(b,k);
  const xn=(x==null||x===''), yn=(y==null||y==='');
  if(xn&&yn) return 0;
  if(xn) return 1;              // 欠測は常に末尾
  if(yn) return -1;
  if(k==='nm') return dir*String(x).localeCompare(String(y),'ja');
  return dir*(Number(x)-Number(y));
}
function renderMachines(d){
  const rows=d.m.slice().sort((a,b)=>cmpVal(a,b,SORT.k,SORT.dir));
  const tb=document.querySelector('#mtbl tbody'); tb.innerHTML='';
  rows.forEach((m,i)=>{
    tb.insertAdjacentHTML('beforeend',
      `<tr><td>${i+1}</td>`+
      `<td>${LK.has(m[0])
          ? `<a href="hall_${HID}_machine_${m[0]}.html">${esc(NM[m[0]])}</a>`
          : `<span title="この機種の個別ページはありません（台別データ未収集の期間の機種）" style="color:var(--sub)">${esc(NM[m[0]])}</span>`}</td>`+
      `<td>${num(m[1])}</td><td class="${cls(m[2])}">${fmt(m[2])}</td>`+
      `<td>${num(m[3])}</td><td>${m[4]==null?'-':m[4]+'%'}</td>`+
      `<td>${m[5]==null?'-':m[5]+'%'}</td></tr>`);
  });
  document.querySelectorAll('#mtbl th.sortable').forEach(th=>{
    const on=th.dataset.k===SORT.k;
    th.style.color=on?'var(--accent)':'';
    th.dataset.arrow=on?(SORT.dir<0?' ▼':' ▲'):'';
    th.textContent=th.textContent.replace(/[ ▼▲]+$/,'')+(th.dataset.arrow||'');
  });
}
function render(k){
  const d=D[k]; if(!d) return;
  const ymd=k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6,8);
  document.getElementById('ttl').innerHTML='📅 '+ymd+'('+d.dow+')'
    + (d.sp?' <span class="badge" style="background:rgba(255,213,79,.2);color:var(--yellow)">特定日</span>':'');
  // 前日比: KEYS は新しい順なので、次の要素が「1つ前の収録日」。
  // ※ 収録が飛んでいる場合は暦の前日とは限らないため、比較対象の日付を必ず併記する。
  // ※ 年をまたぐ比較はしない（このページに前年のデータが無い）。年頭の日だけ空欄になる。
  const i0=KEYS.indexOf(k), pk=(i0>=0&&i0<KEYS.length-1)?KEYS[i0+1]:null;
  const pd=pk?D[pk]:null;
  let diff='';
  if(pd&&pd.avg!=null&&d.avg!=null){
    const dv=d.avg-pd.avg;
    diff=`<div class="kpi"><div class="v ${cls(dv)}">${fmt(dv)}</div>`
       + `<div class="l">前回比(${pk.slice(4,6)}/${pk.slice(6,8)})</div></div>`;
  }
  document.getElementById('kpis').innerHTML=
    `<div class="kpi"><div class="v ${cls(d.total)}">${fmt(d.total)}</div><div class="l">総差枚</div></div>`+
    `<div class="kpi"><div class="v ${cls(d.avg)}">${fmt(d.avg)}</div><div class="l">平均差枚</div></div>`+
    diff+
    `<div class="kpi"><div class="v">${d.units}</div><div class="l">台数</div></div>`+
    `<div class="kpi"><div class="v">${d.m.length}</div><div class="l">機種数</div></div>`;
  renderMachines(d);
  const dt=document.querySelector('#dtbl tbody'); dt.innerHTML='';
  if(!d.dg.length){
    // ⚠️ 「無い理由」は2種類ある。混ぜると『待てば入る』と誤解する。
    //   ① 台別の収集開始前（UNITFROM より古い日）＝**待っても入らない**
    //   ② 収集済み期間なのに空＝みんレポの台別が機種別より1日遅れることがある
    let msg;
    if(UNITFROM && k < UNITFROM){
      const f2=x=>x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6,8);
      msg='この日は台別データがありません（台別の収録は '+f2(UNITFROM)+' 以降）';
    } else {
      const lat=KEYS.find(x=>D[x].dg&&D[x].dg.length);
      const jump=lat?` → <a href="?d=${lat}" style="color:var(--accent)">${lat.slice(4,6)}/${lat.slice(6,8)}の末尾別を見る</a>`:'';
      msg='この日は台別データがありません（台別は機種別より1日遅れて入ることがあります）'+jump;
    }
    dt.innerHTML='<tr><td colspan="3" style="color:var(--sub)">'+msg+'</td></tr>';
  }
  else d.dg.forEach(x=>dt.insertAdjacentHTML('beforeend',
    `<tr><td>末尾${x[0]}</td><td class="${cls(x[1])}">${fmt(x[1])}</td><td>${x[2]}</td></tr>`));
  const i=KEYS.indexOf(k);
  // 年の端では隣の年ページへ送る（送り先があるならボタンは有効のまま）。
  document.getElementById('prev').disabled = (i>=KEYS.length-1) && !ADJ.p;
  document.getElementById('next').disabled = (i<=0) && !ADJ.n;
  document.getElementById('dsel').value=k;
  history.replaceState(null,'','?d='+k);
}
const sel=document.getElementById('dsel');
KEYS.forEach(k=>{const o=document.createElement('option');o.value=k;
  o.textContent=k.slice(4,6)+'/'+k.slice(6,8)+'('+D[k].dow+')'+(D[k].sp?' ★特定日':'');
  sel.appendChild(o);});
sel.onchange=()=>render(sel.value);
const ysel=document.getElementById('ysel');
YEARS.slice().reverse().forEach(function(yf){
  const o=document.createElement('option');
  o.value=yf[1];o.textContent=yf[0]+'年';if(yf[0]===YEAR)o.selected=true;
  ysel.appendChild(o);});
ysel.onchange=()=>{ if(ysel.value) location.href=ysel.value; };
/* 列見出しで並べ替え。同じ列を再タップで昇順/降順を反転。
   ⚠️ 機種名だけ既定を昇順にする（あいうえお順が自然）。数値は降順が自然。 */
document.querySelectorAll('#mtbl th.sortable').forEach(th=>{
  th.style.cursor='pointer';
  th.onclick=()=>{
    const k=th.dataset.k;
    SORT = (SORT.k===k) ? {k:k, dir:-SORT.dir} : {k:k, dir:(k==='nm'?1:-1)};
    const d=D[sel.value]; if(d) renderMachines(d);
  };
});
document.getElementById('prev').onclick=()=>{
  const i=KEYS.indexOf(sel.value);
  if(i<KEYS.length-1) render(KEYS[i+1]);
  else if(ADJ.p) location.href=ADJ.p[0]+'?d='+ADJ.p[1];
};
document.getElementById('next').onclick=()=>{
  const i=KEYS.indexOf(sel.value);
  if(i>0) render(KEYS[i-1]);
  else if(ADJ.n) location.href=ADJ.n[0]+'?d='+ADJ.n[1];
};
const q=new URLSearchParams(location.search).get('d');
const YMAP={}; YEARS.forEach(function(yf){ YMAP[yf[0]]=yf[1]; });
// 別の年の日付が来たら、その年のページへ転送する（黙って別の日を出さない）。
if(q&&/^[0-9]{8}$/.test(q)&&q.slice(0,4)!==YEAR&&YMAP[q.slice(0,4)]){
  location.replace(YMAP[q.slice(0,4)]+'?d='+q);
} else {
  if(q&&!KEYS.includes(q)){
    // ⚠️ URL の日付とページの中身が食い違うのを**黙って**やらない（2026-08-22 修正）。
    //    以前は無条件に KEYS[0]（最新日）を描画していたため、別の日の数字を読む事故が起きうる。
    // ⚠️ 8桁でない値（`?d=abc`）を日付として整形すると "abc--" になる。そのまま出す。
    const f3=x=>/^[0-9]{8}$/.test(x)?x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6,8):x;
    const w=document.createElement('div');w.className='card';
    w.style.borderColor='var(--yellow)';
    const p=document.createElement('p');
    p.className='note'; p.style.color='var(--yellow)';
    p.textContent='⚠️ 指定された日 '+f3(q)
      +' のページはありません（未生成、またはその日のデータが無い）。'
      +'代わりに '+f3(KEYS[0])+' を表示しています。';
    w.appendChild(p);
    document.body.insertBefore(w,document.body.firstChild);
  }
  render(KEYS.includes(q)?q:KEYS[0]);
}
</script></body></html>
