      `<td>${m.u??'-'}</td><td class="${cls(m.p)}">${fmt(m.p)}</td>`+
      `<td>${m.g?m.g.toLocaleString():'-'}</td><td>${m.r??'-'}%</td><td>${m.w}%</td></tr>`);

    // みんレポは台別(daily_data)が機種別(machine_daily_summary)より1日遅れることがあるため、
